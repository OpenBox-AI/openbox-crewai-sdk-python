[project]
name = "openbox-crewai-sdk-python"
version = "1.0.0"
description = "OpenBox SDK - Governance and observability for CrewAI agent workflows"
authors = [
    { name = "OpenBox Team", email = "tony@openbox.ai" },
]
requires-python = ">=3.10,<3.14"
readme = "README.md"
license = "MIT"
keywords = ["crewai", "agent", "flow", "crew", "governance", "observability", "opentelemetry", "hitl", "human-in-the-loop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "crewai>=1.14.1",
    "httpx>=0.28.0,<1",
    # OpenTelemetry core (lower bound matches crewai's otel pin)
    "opentelemetry-api>=1.34.0",
    "opentelemetry-sdk>=1.34.0",
    # HTTP instrumentation
    "opentelemetry-instrumentation-httpx>=0.50b0",
    "opentelemetry-instrumentation-requests>=0.50b0",
    "opentelemetry-instrumentation-urllib3>=0.50b0",
    "opentelemetry-instrumentation-urllib>=0.50b0",
    # Database drivers
    "psycopg2-binary>=2.9.10",
    "asyncpg>=0.29.0",
    "aiopg>=1.4.0",
    "psycopg[binary]>=3.2.0",
    "mysql-connector-python>=8.0.0,<9.7",
    "pymysql>=1.0.0",
    "pymongo>=4.0.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "wrapt>=1.16.0",
    # Database instrumentation
    "opentelemetry-instrumentation-psycopg2>=0.50b0",
    "opentelemetry-instrumentation-asyncpg>=0.50b0",
    "opentelemetry-instrumentation-mysql>=0.50b0",
    "opentelemetry-instrumentation-pymysql>=0.50b0",
    "opentelemetry-instrumentation-pymongo>=0.50b0",
    "opentelemetry-instrumentation-redis>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    "python-dotenv>=1.1.1",
    "cryptography>=42.0.0",
]

[project.urls]
Homepage = "https://github.com/OpenBox-AI/openbox-crewai-sdk-python"
Documentation = "https://github.com/OpenBox-AI/openbox-crewai-sdk-python#readme"
Repository = "https://github.com/OpenBox-AI/openbox-crewai-sdk-python.git"
Issues = "https://github.com/OpenBox-AI/openbox-crewai-sdk-python/issues"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.26.0,<0.27",
    "ruff>=0.4.0",
    "pyright>=1.1.390",
    "pytest-cov>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openbox"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
